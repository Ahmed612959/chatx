<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>لوحة تفعيل Premium | School X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
        --bg: #0a0e1a; --bg-2: #131827; --bg-glass: rgba(19, 24, 39, 0.75); --bg-3: #1a2032;
        --accent: #6366f1; --accent-2: #8b5cf6;
        --gold: #d4af37; --gold-2: #f0c869;
        --text-1: #f1f5f9; --text-2: #94a3b8; --text-3: #64748b;
        --border: rgba(255, 255, 255, 0.08);
        --success: #10b981; --danger: #ef4444;
        --radius: 16px; --radius-sm: 10px;
    }
    /* الوضع النهاري — نفس متغيرات الألوان اللي في التطبيق الرئيسي عشان يبقى شكل موحّد */
    body.light {
        --bg: #f8fafc; --bg-2: #ffffff; --bg-glass: rgba(255, 255, 255, 0.85); --bg-3: #f1f5f9;
        --accent: #4f46e5; --accent-2: #7c3aed;
        --gold: #b8860b; --gold-2: #d4af37;
        --text-1: #0f172a; --text-2: #475569; --text-3: #94a3b8;
        --border: rgba(0, 0, 0, 0.08);
        --success: #059669; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text-1);
        min-height: 100vh; display: flex; flex-direction: column;
        transition: background .2s ease, color .2s ease;
    }
    #themeToggleFloating {
        position: fixed; top: 14px; left: 14px; z-index: 50;
    }
    /* ====================== شاشة تسجيل الدخول ====================== */
    #loginScreen {
        flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
        background: var(--bg-glass); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 32px 26px; width: 100%; max-width: 360px; text-align: center;
    }
    .login-crown { font-size: 34px; margin-bottom: 6px; }
    .login-card h1 { font-size: 18px; margin-bottom: 4px; }
    .login-card p { font-size: 12.5px; color: var(--text-2); margin-bottom: 22px; }
    .field { text-align: right; margin-bottom: 12px; }
    .field label { font-size: 11.5px; color: var(--text-2); display: block; margin-bottom: 5px; }
    .field input {
        width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
        background: var(--bg-3); color: var(--text-1); font-family: inherit; font-size: 14px;
    }
    .field input:focus { outline: none; border-color: var(--gold); }
    .btn {
        width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
        background: linear-gradient(120deg, var(--gold), var(--gold-2)); color: #1a1400;
        font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 6px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-plain {
        background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border);
        font-weight: 600; font-size: 12.5px; width: auto; padding: 8px 14px;
    }
    .error-box {
        background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); color: #fca5a5;
        border-radius: var(--radius-sm); padding: 9px 12px; font-size: 12px; margin-top: 14px; text-align: right;
    }
    /* لون النص الفاتح (#fca5a5) بيبقى واضح على خلفية غامقة بس، في الوضع النهاري
       الخلفية بيضا فبنستخدم أحمر غامق بدل الفاتح عشان التباين يفضل واضح. */
    body.light .error-box { color: #b91c1c; }

    /* ====================== الشاشة الرئيسية ====================== */
    #mainScreen { display: none; flex: 1; flex-direction: column; }
    header {
        display: flex; align-items: center; justify-content: space-between; padding: 14px 18px;
        border-bottom: 1px solid var(--border); background: var(--bg-2); position: sticky; top: 0; z-index: 5;
    }
    header .title { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    header .who { font-size: 11.5px; color: var(--text-2); }

    .wrap { max-width: 720px; width: 100%; margin: 0 auto; padding: 16px; flex: 1; }

    .search-row { position: relative; margin-bottom: 14px; }
    .search-row i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
    #searchInput {
        width: 100%; padding: 12px 40px 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
        background: var(--bg-glass); color: var(--text-1); font-family: inherit; font-size: 14px;
    }
    #searchInput:focus { outline: none; border-color: var(--accent); }

    #studentList { display: flex; flex-direction: column; gap: 8px; }
    .student-row {
        display: flex; align-items: center; gap: 12px; background: var(--bg-glass); border: 1px solid var(--border);
        border-radius: var(--radius-sm); padding: 12px 14px; cursor: pointer; transition: border-color .15s;
    }
    .student-row:hover, .student-row:active { border-color: var(--accent); }
    .student-avatar {
        width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .student-meta { font-size: 11px; color: var(--text-3); }
    .premium-count {
        font-size: 10.5px; padding: 3px 9px; border-radius: 20px; flex-shrink: 0; white-space: nowrap;
        background: var(--bg-3); color: var(--text-3);
    }
    .premium-count.active { background: linear-gradient(120deg, var(--gold), var(--gold-2)); color: #1a1400; font-weight: 700; }

    #emptyState, #loadingState { text-align: center; padding: 50px 20px; color: var(--text-3); font-size: 13px; }
    #loadingState i { font-size: 22px; display: block; margin-bottom: 10px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ====================== لوحة تعديل الطالب (Bottom Sheet) ====================== */
    #editOverlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end;
        justify-content: center; z-index: 50;
    }
    #editOverlay.active { display: flex; }
    #apiKeysOverlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end;
        justify-content: center; z-index: 50;
    }
    #apiKeysOverlay.active { display: flex; }
    #apiKeysSheet {
        background: var(--bg-2); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
        max-height: 88vh; overflow-y: auto; overflow-x: hidden; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        animation: slideUp .2s ease; box-sizing: border-box;
    }
    .apikey-row {
        border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
        box-sizing: border-box; max-width: 100%; overflow: hidden;
    }
    .apikey-row .apikey-title {
        font-weight: 800; font-size: 13.5px; margin-bottom: 6px; display: flex; align-items: center;
        justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .apikey-row .apikey-meta { font-size: 11px; color: var(--text-3); margin-bottom: 10px; line-height: 1.6; }
    .apikey-row input {
        width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--bg-1); color: var(--text-1); font-size: 16px; margin-bottom: 8px; box-sizing: border-box;
    }
    /* عناصر مفتاح واحد داخل قائمة مفاتيح المزوّد */
    .apikey-item {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--bg-1);
        border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    }
    .apikey-item .apikey-value {
        font-family: monospace; font-size: 11.5px; color: var(--text-2); word-break: break-all;
        flex: 1 1 140px; min-width: 0;
    }
    .apikey-item .apikey-label { font-size: 10px; color: var(--text-3); flex-basis: 100%; }
    .apikey-item .apikey-actions { display: flex; gap: 6px; flex-shrink: 0; margin-right: auto; }
    .apikey-item .apikey-actions button {
        width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-2);
        color: var(--text-2); cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; padding: 0;
    }
    .apikey-item .apikey-fail { color: var(--danger); font-size: 10px; flex-basis: 100%; }
    .apikey-add-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .apikey-add-row input { flex: 1 1 100%; margin-bottom: 6px; }
    .apikey-add-row button { flex: 1 1 100%; margin-top: 0; }
    @media (min-width: 380px) {
        .apikey-add-row input { flex: 1 1 auto; margin-bottom: 0; }
        .apikey-add-row button { flex: 0 0 auto; white-space: nowrap; padding-left: 14px; padding-right: 14px; }
    }
    #editSheet {
        background: var(--bg-2); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
        max-height: 88vh; overflow-y: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
        animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 14px; }
    .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .sheet-avatar {
        width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; flex-shrink: 0;
    }
    .sheet-head .name { font-weight: 800; font-size: 15.5px; }
    .sheet-head .code { font-size: 11.5px; color: var(--text-3); }
    .close-sheet {
        margin-right: auto; background: var(--bg-3); border: none; color: var(--text-2); width: 30px; height: 30px;
        border-radius: 50%; cursor: pointer; font-size: 13px;
    }

    .feature-card {
        display: flex; align-items: flex-start; gap: 12px; background: var(--bg-glass); border: 1px solid var(--border);
        border-radius: var(--radius-sm); padding: 13px; margin-bottom: 9px; cursor: pointer;
    }
    .feature-card.checked { border-color: var(--gold); background: rgba(212,175,55,.08); }
    .feature-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .feature-body { flex: 1; }
    .feature-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .feature-desc { font-size: 11px; color: var(--text-2); line-height: 1.6; }
    .feature-switch {
        width: 42px; height: 24px; border-radius: 20px; background: var(--bg-3); position: relative; flex-shrink: 0;
        margin-top: 2px; transition: background .15s;
    }
    .feature-card.checked .feature-switch { background: linear-gradient(120deg, var(--gold), var(--gold-2)); }
    .feature-switch::after {
        content: ''; position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
        background: #fff; transition: transform .15s;
    }
    .feature-card.checked .feature-switch::after { transform: translateX(-18px); }

    .save-row { display: flex; gap: 8px; margin-top: 16px; }
    .save-row .btn { margin-top: 0; }
    #saveStatus { font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

    .toast {
        position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
        background: var(--bg-3); border: 1px solid var(--border); color: var(--text-1); padding: 11px 18px;
        border-radius: 30px; font-size: 13px; z-index: 100; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .toast.show { display: block; animation: slideUp .2s ease; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
</style>
</head>
<body>
    <button id="themeToggleFloating" class="btn-plain" style="width:34px;height:34px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;" aria-label="تبديل الوضع الليلي والنهاري" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>

    <!-- تسجيل الدخول -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-crown">👑</div>
            <h1>لوحة تفعيل Premium</h1>
            <p>سجّل دخولك بحساب الأدمن بتاعك في School X</p>
            <div class="field">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUsername" autocomplete="username">
            </div>
            <div class="field">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" autocomplete="current-password">
            </div>
            <button class="btn" id="loginBtn" onclick="doLogin()">دخول</button>
            <div id="loginError" class="error-box" style="display:none;"></div>
        </div>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="mainScreen">
        <header>
            <div class="title">👑 لوحة تفعيل Premium</div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="who" id="whoAmI"></span>
                <button class="btn btn-plain" onclick="openApiKeysSheet()"><i class="fas fa-key"></i> مفاتيح API</button>
                <button class="btn btn-plain" onclick="doLogout()">خروج</button>
            </div>
        </header>
        <div class="wrap">
            <div class="search-row">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="دور باسم الطالب أو اليوزرنيم أو كود الطالب..." oninput="renderStudentList()">
            </div>
            <div id="loadingState"><i class="fas fa-spinner"></i>جاري تحميل الطلاب...</div>
            <div id="emptyState" style="display:none;">مفيش طلاب مطابقين للبحث</div>
            <div id="studentList"></div>
        </div>
    </div>

    <!-- تعديل مميزات طالب -->
    <div id="editOverlay" onclick="if(event.target===this) closeEditSheet()">
        <div id="editSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <div class="sheet-avatar" id="sheetAvatar"></div>
                <div>
                    <div class="name" id="sheetName"></div>
                    <div class="code" id="sheetCode"></div>
                </div>
                <button class="close-sheet" onclick="closeEditSheet()"><i class="fas fa-times"></i></button>
            </div>
            <div id="featureCards"></div>
            <div class="save-row">
                <button class="btn" id="saveBtn" onclick="savePremium()">حفظ التغييرات</button>
            </div>
            <div id="saveStatus"></div>
        </div>
    </div>

    <!-- إدارة مفاتيح API لمزوّدين إنشاء/تحليل الصور (Qwen، Grok، ...) -->
    <div id="apiKeysOverlay" onclick="if(event.target===this) closeApiKeysSheet()">
        <div id="apiKeysSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <div>
                    <div class="name">🔑 مفاتيح API</div>
                    <div class="code">Qwen، Grok، وأي مزوّد تاني — بيتحفظوا في الداتابيز، من غير ما تحتاج Redeploy</div>
                </div>
                <button class="close-sheet" onclick="closeApiKeysSheet()"><i class="fas fa-times"></i></button>
            </div>
            <div id="apiKeysList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script>
    const API = 'https://schoolx-eta.vercel.app';
    const TOKEN_KEY = 'sx_admin_panel_token';
    const USER_KEY = 'sx_admin_panel_user';

    // نفس مفاتيح المميزات المستخدمة في تطبيق الطالب — لازم تفضل متطابقة مع index.html
    const FEATURES = [
        { key: 'premium_ai', icon: '🧠', title: 'الذكاء الاصطناعي المتقدم (Cerebras / Claude Opus)', desc: 'يفتح قسم موديلات Premium (Cerebras وClaude Opus) في قايمة الموديلات + حد رسايل أعلى بكتير.' },
        { key: 'premium_mock_exams', icon: '📝', title: 'امتحانات المحاكاة الشاملة', desc: 'امتحان محاكاة من أكتر من فصل مع تقرير أداء مفصل.' },
        { key: 'premium_prompts', icon: '⚡', title: 'مكتبة البرومبتس الذكية', desc: 'برومبتس جاهزة ومُختارة لأفضل نتيجة في كل مهمة.' },
        { key: 'premium_theme', icon: '👑', title: 'تصميم Chat X الذهبي', desc: 'شكل مميز حصري بألوان ذهبية.' },
        { key: 'premium_drug_library', icon: '💊', title: 'مكتبة الأدوية الشخصية', desc: 'حفظ تلقائي لكل دواء يفحصه الطالب بالكاميرا.' },
        { key: 'premium_clinical_sim', icon: '🩺', title: 'محاكي المواقف الإكلينيكية', desc: 'حالة مريض تفاعلية بتقييم لقرارات الطالب في الآخر.' },
        { key: 'premium_lecture_audio', icon: '🎙️', title: 'ملخص صوتي للمحاضرات', desc: 'تسجيل صوتي يتحول لنص كامل ثم ملخص منظم بالنقاط.' },
        { key: 'premium_video_sim', icon: '🎬', title: 'الفيديو المتفرّع (محاكاة قرارات)', desc: 'مشهد سريري تفاعلي بمشاهد وصوت — الطالب يختار قرارات فتتفرّع الحالة لنهايات مختلفة.' },
        { key: 'premium_voice', icon: '🎧', title: 'صوت واقعي فائق (ElevenLabs)', desc: 'ترقية تلقائية لأعلى جودة صوت في كل مكان في التطبيق — من غير أي إعداد إضافي من الطالب.' },
        { key: 'premium_skills', icon: '🧩', title: 'مهارات مخصصة (Skills)', desc: 'الطالب يقدر يعمل/يرفع مهارات (تعليمات ثابتة) والمساعد يستخدمها تلقائي في ردوده.' },
        { key: 'premium_german_pro', icon: '🇩🇪', title: 'German Pro — الألمانية الاحترافية للتمريض', desc: 'مدرّس ألماني ذكي متخصص في التمريض، بيبني خطة تعلّم شخصية (أساسيات + محادثات يومية + Fachsprache Pflege) ويمشي الطالب فيها خطوة بخطوة مع مراجعة مستمرة.' },
        { key: 'premium_english_pro', icon: '🇬🇧', title: 'English Pro — الإنجليزية الاحترافية للتمريض', desc: 'مدرّس إنجليزي ذكي متخصص في التمريض (تحضير OET/IELTS)، بيبني خطة تعلّم شخصية مع قاموس طبي وتمريضي وصيدلي كامل، ويمشي الطالب خطوة بخطوة مع مراجعة مستمرة.' },
        { key: 'premium_academic_profile', icon: '📊', title: 'البروفايل الأكاديمي الموحّد', desc: 'شاشة واحدة فيها حضور الطالب، نتائج امتحاناته، الواجبات المستحقة، والمخالفات — بدل ما تكون متفرقة.' },
        { key: 'premium_image_studio', icon: '🖼️', title: 'استوديو الصور الذكي', desc: 'تحليل أي صورة برؤية ذكاء اصطناعي حقيقية (مش OCR بس)، وإنشاء صور من وصف نصي.' }
    ];

    // ====================== الوضع الليلي / النهاري ======================
    // بنستخدم نفس مفتاح التخزين اللي بيستخدمه التطبيق الرئيسي (sx_settings.theme) عشان
    // لو الأدمن نفسه طالب برضه وفاتح التطبيق الرئيسي، الاختيار يفضل موحّد بين الاتنين.
    const THEME_KEY = 'sx_admin_theme';
    function getPreferredTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light' || saved === 'dark') return saved;
        const systemLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        return systemLight ? 'light' : 'dark';
    }
    function applyTheme(theme) {
        document.body.classList.toggle('light', theme === 'light');
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme() {
        const next = document.body.classList.contains('light') ? 'dark' : 'light';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
    }
    applyTheme(getPreferredTheme());

    let token = localStorage.getItem(TOKEN_KEY) || '';
    let allStudents = [];
    let activeStudent = null; // الطالب المفتوح دلوقتي في شيت التعديل
    let pendingFeatures = new Set();

    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (type || '');
        setTimeout(() => t.classList.remove('show'), 2600);
    }

    async function apiFetch(path, options = {}) {
        const res = await fetch(API + path, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(options.headers || {}) }
        });
        if (res.status === 401 || res.status === 403) {
            doLogout();
            throw new Error('الجلسة منتهية، سجّل دخول تاني');
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'حصل خطأ');
        return data;
    }

    async function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errBox = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');
        errBox.style.display = 'none';
        if (!username || !password) { errBox.textContent = 'اكتب اسم المستخدم وكلمة المرور'; errBox.style.display = 'block'; return; }
        btn.disabled = true; btn.textContent = 'جاري الدخول...';
        try {
            const res = await fetch(API + '/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'بيانات غير صحيحة');
            if (data.user.type !== 'admin') throw new Error('الحساب ده مش حساب أدمن — اللوحة دي للأدمن بس');
            token = data.token;
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(USER_KEY, JSON.stringify(data.user));
            enterMainScreen(data.user);
        } catch (e) {
            errBox.textContent = e.message;
            errBox.style.display = 'block';
        } finally {
            btn.disabled = false; btn.textContent = 'دخول';
        }
    }

    function doLogout() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        token = '';
        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
    }

    function enterMainScreen(user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'flex';
        document.getElementById('whoAmI').textContent = user.fullName || user.username;
        loadStudents();
    }

    async function loadStudents() {
        document.getElementById('loadingState').style.display = 'block';
        document.getElementById('studentList').innerHTML = '';
        document.getElementById('emptyState').style.display = 'none';
        try {
            allStudents = await apiFetch('/api/admin/students');
            renderStudentList();
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            document.getElementById('loadingState').style.display = 'none';
        }
    }

    function renderStudentList() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = !q ? allStudents : allStudents.filter(s =>
            (s.fullName || '').toLowerCase().includes(q) ||
            (s.username || '').toLowerCase().includes(q) ||
            (s.studentCode || '').toLowerCase().includes(q)
        );
        const list = document.getElementById('studentList');
        if (!list.dataset.delegatedClick) {
            // event delegation آمن بدل onclick inline: بنقرا القيمة من data-* attribute
            // (نص خام من dataset، مش بيتفسّر كـ HTML/JS خالص) بدل ما نحقنها جوه
            // سطر onclick نصي كان ممكن ينكسر لو studentCode فيه علامة اقتباس.
            list.addEventListener('click', (e) => {
                const row = e.target.closest('[data-student-code]');
                if (row) openEditSheet(row.dataset.studentCode);
            });
            list.dataset.delegatedClick = '1';
        }
        document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
        list.innerHTML = filtered.slice(0, 200).map(s => {
            const count = (s.premiumFeatures || []).length;
            const initial = (s.fullName || s.username || '?').trim().charAt(0);
            return `
                <div class="student-row" data-student-code="${escapeHtml(s.studentCode || '')}">
                    <div class="student-avatar">${initial}</div>
                    <div class="student-info">
                        <div class="student-name">${escapeHtml(s.fullName || s.username)}</div>
                        <div class="student-meta">@${escapeHtml(s.username)} · ${escapeHtml(s.studentCode || '')}</div>
                    </div>
                    <div class="premium-count ${count ? 'active' : ''}">${count ? count + ' مميزة مفعّلة' : 'من غير Premium'}</div>
                </div>`;
        }).join('');
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str == null ? '' : String(str);
        return d.innerHTML;
    }

    function openEditSheet(studentCode) {
        const s = allStudents.find(x => x.studentCode === studentCode);
        if (!s) return;
        activeStudent = s;
        pendingFeatures = new Set(s.premiumFeatures || []);
        document.getElementById('sheetAvatar').textContent = (s.fullName || s.username || '?').trim().charAt(0);
        document.getElementById('sheetName').textContent = s.fullName || s.username;
        document.getElementById('sheetCode').textContent = '@' + s.username + ' · ' + (s.studentCode || '');
        document.getElementById('saveStatus').textContent = '';
        renderFeatureCards();
        document.getElementById('editOverlay').classList.add('active');
    }

    function closeEditSheet() {
        document.getElementById('editOverlay').classList.remove('active');
        activeStudent = null;
    }

    // ====================== إدارة مفاتيح API (Qwen، Grok، Kling، ...) ======================
    // المزوّدين المعروفين حاليًا بالكود — لو ضفت مزوّد جديد في index.js، ضيفه هنا
    // كمان عشان يظهر في اللوحة (اسم الحقل هنا لازم يطابق اسم الـ provider بالظبط).
    // كل مزوّد ممكن يكون ليه أكتر من مفتاح — لو مفتاح فشل، النظام بيتحول
    // للمفتاح اللي بعده لنفس المزوّد تلقائيًا.
    const KNOWN_PROVIDERS = [
        { key: 'qwen', label: 'Qwen', hint: 'مفتاح DashScope الرسمي — من dashscope.console.aliyun.com' },
        { key: 'grok', label: 'Grok (عن طريق CometAPI)', hint: 'مفتاح CometAPI — من api.cometapi.com — بيدعم تعديل صور' },
        { key: 'kling', label: 'Kling (عن طريق CometAPI)', hint: 'مفتاح CometAPI — من api.cometapi.com — بيدعم تعديل صور' }
    ];

    let revealedKeys = {}; // { "provider:keyId": "المفتاح الكامل" } — مؤقت في الذاكرة بس

    async function openApiKeysSheet() {
        revealedKeys = {};
        document.getElementById('apiKeysOverlay').classList.add('active');
        await loadApiKeys();
    }

    function closeApiKeysSheet() {
        document.getElementById('apiKeysOverlay').classList.remove('active');
    }

    function escapeHtmlLocal(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadApiKeys() {
        const listEl = document.getElementById('apiKeysList');
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3);"><i class="fas fa-spinner"></i></div>';
        try {
            const saved = await apiFetch('/api/admin/api-keys');
            const savedMap = new Map(saved.map(s => [s.provider, s]));
            listEl.innerHTML = KNOWN_PROVIDERS.map(p => {
                const existing = savedMap.get(p.key);
                const keys = existing?.keys || [];
                const keysHtml = keys.length ? keys.map(k => {
                    const revealKey = `${p.key}:${k.id}`;
                    const shown = revealedKeys[revealKey];
                    return `
                        <div class="apikey-item">
                            <span class="apikey-value" id="apikeyVal_${p.key}_${k.id}">${shown ? escapeHtmlLocal(shown) : k.maskedKey}</span>
                            <div class="apikey-actions">
                                <button title="${shown ? 'إخفاء' : 'إظهار كامل'}" onclick="toggleRevealKey('${p.key}','${k.id}')"><i class="fas ${shown ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                                <button title="حذف" onclick="deleteApiKey('${p.key}','${k.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                            ${k.label ? `<span class="apikey-label">${escapeHtmlLocal(k.label)}</span>` : ''}
                            ${k.failCount > 0 ? `<span class="apikey-fail"><i class="fas fa-triangle-exclamation"></i> فشل ${k.failCount} مرة${k.lastError ? ' — ' + escapeHtmlLocal(k.lastError) : ''}</span>` : ''}
                        </div>
                    `;
                }).join('') : '<div style="font-size:11px;color:var(--text-3);margin-bottom:8px;">مفيش مفاتيح مضبوطة</div>';
                return `
                    <div class="apikey-row">
                        <div class="apikey-title">
                            <span>${p.label}</span>
                            <span style="font-size:10.5px;color:var(--text-3);">${keys.length} مفتاح</span>
                        </div>
                        <div class="apikey-meta">${p.hint}</div>
                        ${keysHtml}
                        <div class="apikey-add-row">
                            <input type="text" id="apikeyInput_${p.key}" placeholder="الصق مفتاح جديد هنا..." autocomplete="off">
                            <button class="btn" onclick="saveApiKey('${p.key}')"><i class="fas fa-plus"></i> إضافة</button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            listEl.innerHTML = `<div style="text-align:center;padding:20px;color:var(--danger);">${e.message}</div>`;
        }
    }

    async function saveApiKey(provider) {
        const input = document.getElementById(`apikeyInput_${provider}`);
        const value = input.value.trim();
        if (!value) { showToast('اكتب المفتاح الأول', 'error'); return; }
        try {
            await apiFetch('/api/admin/api-keys', { method: 'POST', body: JSON.stringify({ provider, apiKey: value }) });
            showToast('اتضاف المفتاح بنجاح', 'success');
            await loadApiKeys();
        } catch (e) {
            showToast(e.message || 'تعذر حفظ المفتاح', 'error');
        }
    }

    async function deleteApiKey(provider, keyId) {
        try {
            await apiFetch(`/api/admin/api-keys/${provider}/${keyId}`, { method: 'DELETE' });
            delete revealedKeys[`${provider}:${keyId}`];
            showToast('اتمسح المفتاح', 'success');
            await loadApiKeys();
        } catch (e) {
            showToast(e.message || 'تعذر حذف المفتاح', 'error');
        }
    }

    // إظهار/إخفاء المفتاح كامل — بيتخزن مؤقتًا في الذاكرة (revealedKeys) عشان
    // مايتكررش الطلب للسيرفر كل مرة يعيد رسم القائمة.
    async function toggleRevealKey(provider, keyId) {
        const mapKey = `${provider}:${keyId}`;
        if (revealedKeys[mapKey]) {
            delete revealedKeys[mapKey];
            await loadApiKeys();
            return;
        }
        try {
            const data = await apiFetch(`/api/admin/api-keys/${provider}/${keyId}/reveal`);
            revealedKeys[mapKey] = data.apiKey;
            await loadApiKeys();
        } catch (e) {
            showToast(e.message || 'تعذر إظهار المفتاح', 'error');
        }
    }

    function renderFeatureCards() {
        const el = document.getElementById('featureCards');
        el.innerHTML = FEATURES.map(f => `
            <div class="feature-card ${pendingFeatures.has(f.key) ? 'checked' : ''}" onclick="toggleFeature('${f.key}')">
                <div class="feature-icon">${f.icon}</div>
                <div class="feature-body">
                    <div class="feature-title">${escapeHtml(f.title)}</div>
                    <div class="feature-desc">${escapeHtml(f.desc)}</div>
                </div>
                <div class="feature-switch"></div>
            </div>
        `).join('');
    }

    function toggleFeature(key) {
        if (pendingFeatures.has(key)) pendingFeatures.delete(key);
        else pendingFeatures.add(key);
        renderFeatureCards();
    }

    async function savePremium() {
        if (!activeStudent) return;
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('saveStatus');
        btn.disabled = true; btn.textContent = 'جاري الحفظ...';
        status.textContent = '';
        try {
            const data = await apiFetch(`/api/admin/students/${encodeURIComponent(activeStudent.studentCode)}/premium`, {
                method: 'PATCH',
                body: JSON.stringify({ premiumFeatures: Array.from(pendingFeatures) })
            });
            // نحدّث النسخة المحلية عشان القايمة الرئيسية تتحدث فورًا من غير ما نعمل fetch كامل تاني
            const idx = allStudents.findIndex(s => s.studentCode === activeStudent.studentCode);
            if (idx !== -1) allStudents[idx].premiumFeatures = data.student.premiumFeatures;
            renderStudentList();
            status.innerHTML = '<span style="color:var(--success)">اتحفظ ✓</span>';
            showToast(`تم تحديث مميزات ${activeStudent.fullName || activeStudent.username}`, 'success');
            setTimeout(closeEditSheet, 700);
        } catch (e) {
            status.innerHTML = `<span style="color:var(--danger)">${escapeHtml(e.message)}</span>`;
        } finally {
            btn.disabled = false; btn.textContent = 'حفظ التغييرات';
        }
    }

    // دخول تلقائي لو فيه توكن محفوظ من قبل
    (function init() {
        const savedUser = localStorage.getItem(USER_KEY);
        if (token && savedUser) {
            try { enterMainScreen(JSON.parse(savedUser)); }
            catch (e) { doLogout(); }
        }
    })();

    document.getElementById('loginPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
