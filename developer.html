<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عن المطور — Chat X</title>
<meta name="description" content="تعرّف على مطور Chat X، المنصة التعليمية الذكية لطلاب معاهد التمريض.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
        --bg: #0a0e1a; --bg-2: #131827;
        --accent: #6366f1; --accent-2: #8b5cf6; --accent-3: #ec4899;
        --grad-bold: linear-gradient(120deg, var(--accent), var(--accent-2) 55%, var(--accent-3));
        --accent-glow: rgba(99, 102, 241, 0.35);
        --text-1: #f1f5f9; --text-2: #94a3b8; --text-3: #64748b;
        --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text-1);
        min-height: 100vh; padding: 32px 16px 60px; line-height: 1.8;
        position: relative; overflow-x: hidden;
    }
    /* توهج خلفية هادئ ومتحرك — نفس روح باقي التطبيق */
    body::before {
        content: ''; position: fixed; inset: -20%; z-index: -1;
        background: radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15), transparent 40%);
        animation: bgDrift 12s ease-in-out infinite alternate;
    }
    @keyframes bgDrift { from { transform: translate(0,0) scale(1); } to { transform: translate(-3%, 3%) scale(1.05); } }
    @keyframes gradientFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes floatIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 20px 0 var(--accent-glow); } 50% { box-shadow: 0 0 40px 8px var(--accent-glow); } }

    .wrap { max-width: 480px; margin: 0 auto; }

    .back {
        display: inline-flex; align-items: center; gap: 6px; color: var(--text-3);
        text-decoration: none; font-size: 13px; margin-bottom: 24px; transition: color .2s;
    }
    .back:hover { color: var(--accent); }

    .card {
        background: var(--bg-2); border: 1px solid var(--border); border-radius: 24px;
        padding: 32px 24px; text-align: center; animation: floatIn .5s cubic-bezier(0.22,1,0.36,1);
        position: relative; overflow: hidden;
    }
    .card::before {
        content: ''; position: absolute; top: -60%; left: -20%; width: 140%; height: 140%;
        background: var(--grad-bold); background-size: 200% 200%; opacity: .08;
        animation: gradientFlow 8s ease infinite; z-index: 0; pointer-events: none;
    }
    .card > * { position: relative; z-index: 1; }

    .avatar-wrap {
        width: 128px; height: 128px; border-radius: 50%; margin: 0 auto 18px;
        padding: 4px; background: var(--grad-bold); background-size: 200% 200%;
        animation: gradientFlow 6s ease infinite, glowPulse 3s ease-in-out infinite;
    }
    .avatar {
        width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        background: var(--bg-2); display: flex; align-items: center; justify-content: center;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar .fallback-icon { font-size: 46px; color: var(--text-3); }

    .name {
        font-size: 22px; font-weight: 900; margin-bottom: 4px;
        background: linear-gradient(120deg, var(--text-1) 20%, var(--accent) 55%, var(--accent-3));
        background-size: 200% 200%; animation: gradientFlow 6s ease infinite;
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        display: inline-block;
    }
    .role { font-size: 13px; color: var(--text-2); font-weight: 600; margin-bottom: 18px; }

    .bio { font-size: 13.5px; color: var(--text-2); margin-bottom: 24px; }

    .links { display: flex; flex-direction: column; gap: 10px; }
    .link-btn {
        display: flex; align-items: center; gap: 12px; padding: 12px 16px;
        background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
        color: var(--text-1); text-decoration: none; font-size: 13.5px; font-weight: 700;
        transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .link-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 18px -6px var(--accent-glow); }
    .link-btn i { width: 20px; text-align: center; color: var(--accent); font-size: 16px; }

    .made-with { text-align: center; margin-top: 28px; font-size: 12px; color: var(--text-3); }
    .made-with i { color: var(--accent-3); }
</style>
</head>
<body>
<div class="wrap">
    <a href="/" class="back"><i class="fas fa-arrow-right"></i> رجوع لـ Chat X</a>

    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar">
                <!-- ⚠️ ارفع صورتك باسم developer.jpg جوه مجلد /icons/ في المشروع.
                     لو الصورة مش موجودة، الأيقونة الاحتياطية بتظهر تلقائي (onerror تحت). -->
                <img src="/icons/developer.jpg" alt="صورة المطور"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="fallback-icon" style="display:none;"><i class="fas fa-user"></i></div>
            </div>
        </div>

        <h1 class="name">Ahmed Mousaa</h1>
        <div class="role">مطور ويب — صانع Chat X</div>

        <p class="bio">
            طوّرت Chat X عشان أسهّل على طلاب معاهد التمريض رحلتهم الدراسية —
            مساعد ذكاء اصطناعي مجاني متاح على مدار الساعة، بيشرح المناهج ويجاوب على الأسئلة.
        </p>

        <div class="links">
            <!-- ⚠️ استبدل الروابط دي بروابطك الحقيقية -->
            <a href="https://www.facebook.com/profile.php?id=100078721152842" class="link-btn"><i class="fab fa-facebook"></i> تواصل عبر فيسبوك</a>
            <a href="https://wa.me/201095722174" class="link-btn"><i class="fab fa-whatsapp"></i> تواصل عبر واتساب</a>
            <a href="am3560380@gmail.com" class="link-btn"><i class="fas fa-envelope"></i> راسلني بالإيميل</a>
        </div>
    </div>

    <div class="made-with">صُنع بـ <i class="fas fa-heart"></i> لطلاب معاهد التمريض</div>
</div>
</body>
</html>
