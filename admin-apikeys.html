<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>مفاتيح الـ API — Chat X</title>
<style>
    :root {
        --bg: #0a0e1a; --bg-2: #131827; --bg-3: #1a2035;
        --accent: #6366f1; --accent-2: #8b5cf6;
        --text-1: #f1f5f9; --text-2: #94a3b8; --text-3: #64748b;
        --border: rgba(255, 255, 255, 0.08);
        --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text-1); min-height: 100vh; padding: 20px 16px 60px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.7; }
    .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-top: 16px; }
    .banner { font-size: 12px; padding: 10px 12px; border-radius: 10px; margin-top: 14px; line-height: 1.8; }
    .banner.warn { background: rgba(245,158,11,.12); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
    .banner.err { background: rgba(239,68,68,.12); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 6px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-1); border-radius: 9px; padding: 10px 12px; font-size: 13px; outline: none; font-family: var(--font); }
    input:focus { border-color: var(--accent); }
    button { font-family: inherit; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; border-radius: 10px; padding: 9px 16px; white-space: nowrap; }
    button.ghost { background: var(--bg); border: 1px solid var(--border); color: var(--text-2); }
    button.danger-btn { background: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    .provider { border-bottom: 1px solid var(--border); padding: 14px 0; }
    .provider:last-child { border-bottom: none; }
    .p-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .p-label { font-weight: 700; font-size: 13.5px; }
    .p-env-note { font-size: 10.5px; color: var(--text-3); }
    .key-row { display: flex; align-items: center; gap: 8px; background: var(--bg-3); border-radius: 9px; padding: 7px 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .key-val { font-family: monospace; font-size: 12px; flex: 1; }
    .fail-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: rgba(16,185,129,.15); color: var(--success); }
    .fail-badge.bad { background: rgba(239,68,68,.15); color: var(--danger); }
    .key-actions { display: flex; gap: 6px; }
    .key-actions button { padding: 4px 10px; font-size: 11px; }
    .add-row { display: flex; gap: 8px; width: 100%; margin-top: 8px; }
    .add-row input { flex: 1; }
    #loginScreen { max-width: 360px; margin: 60px auto; }
    .err-box { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div id="loginScreen" class="wrap">
    <div class="card">
        <h1 style="font-size:16px;margin-bottom:4px;">دخول لوحة مفاتيح الـ API</h1>
        <div class="sub">اكتب سر الأدمن (ADMIN_PANEL_SECRET) اللي ضبطته في Environment Variables.</div>
        <div style="margin-top:14px;">
            <label>السر</label>
            <input type="password" id="secretInput" autocomplete="off">
        </div>
        <button style="width:100%;margin-top:12px;" onclick="doLogin()">دخول</button>
        <div class="err-box" id="loginErr"></div>
    </div>
</div>

<div class="wrap" id="mainScreen" style="display:none;">
    <h1>مفاتيح الـ API</h1>
    <div class="sub">ضيف أكتر من مفتاح لنفس المزوّد — لو واحد فشل، النظام بيبدّل تلقائيًا للي بعده في المكالمة الجاية من غير أي تدخل منك.</div>
    <div id="kvBanner"></div>
    <div class="card"><div id="list">جارٍ التحميل...</div></div>
    <div style="text-align:center;margin-top:16px;">
        <button class="ghost" onclick="doLogout()">خروج</button>
    </div>
</div>

<script>
    const SECRET_KEY = 'sx_admin_apikeys_secret';
    let secret = localStorage.getItem(SECRET_KEY) || '';

    async function apiCall(options = {}) {
        const res = await fetch('/api/admin-keys', {
            ...options,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + secret, ...(options.headers || {}) }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            if (res.status === 401) doLogout();
            throw new Error(data.error || 'حصل خطأ');
        }
        return data;
    }

    async function doLogin() {
        const val = document.getElementById('secretInput').value.trim();
        const errBox = document.getElementById('loginErr');
        errBox.style.display = 'none';
        if (!val) { errBox.textContent = 'اكتب السر الأول'; errBox.style.display = 'block'; return; }
        secret = val;
        try {
            await apiCall();
            localStorage.setItem(SECRET_KEY, secret);
            enterMain();
        } catch (e) {
            errBox.textContent = e.message;
            errBox.style.display = 'block';
        }
    }

    function doLogout() {
        localStorage.removeItem(SECRET_KEY);
        secret = '';
        document.getElementById('mainScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'block';
    }

    function enterMain() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        loadKeys();
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    async function loadKeys() {
        const list = document.getElementById('list');
        const banner = document.getElementById('kvBanner');
        try {
            const data = await apiCall();
            banner.innerHTML = data.kvConfigured
                ? ''
                : `<div class="banner warn">مفيش Vercel KV (أو Upstash for Redis) مربوط بالمشروع لسه، فمش هتقدر تضيف/تمسح مفاتيح من هنا. اربط KV من Vercel Dashboard → Storage عشان الإضافة المتعددة تشتغل — لحد كده حط أكتر من مفتاح لنفس المزوّد مفصولين بفاصلة في نفس الـ Environment Variable في Vercel وهيتبدّل بينهم تلقائيًا برضه.</div>`;

            list.innerHTML = data.providers.map(p => `
                <div class="provider">
                    <div class="p-head">
                        <div class="p-label">${esc(p.label)}</div>
                        ${p.envHasFallback ? '<div class="p-env-note">+ مفتاح احتياطي من Environment Variables</div>' : ''}
                    </div>
                    ${p.keys.length ? p.keys.map(k => `
                        <div class="key-row">
                            <div class="key-val">${esc(k.masked)}${k.label ? ' · ' + esc(k.label) : ''}</div>
                            <div class="fail-badge ${k.failCount > 0 ? 'bad' : ''}">${k.failCount > 0 ? 'فشل ' + k.failCount + ' مرة' : 'سليم'}</div>
                            <div class="key-actions">
                                <button class="ghost" onclick="revealKey('${p.env}','${k.id}')">كشف</button>
                                <button class="danger-btn" onclick="removeKey('${p.env}','${k.id}')">مسح</button>
                            </div>
                        </div>
                    `).join('') : '<div class="p-env-note">مفيش مفاتيح مضافة من هنا لسه</div>'}
                    <div class="add-row">
                        <input type="text" id="inp_${p.env}" placeholder="الصق مفتاح جديد لـ ${esc(p.label)}...">
                        <button onclick="addKey('${p.env}')">إضافة</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = `<div class="banner err">${esc(e.message)}</div>`;
        }
    }

    async function addKey(env) {
        const input = document.getElementById('inp_' + env);
        const value = input.value.trim();
        if (!value) return;
        try {
            await apiCall({ method: 'POST', body: JSON.stringify({ env, apiKey: value }) });
            input.value = '';
            await loadKeys();
        } catch (e) {
            alert(e.message);
        }
    }

    async function removeKey(env, id) {
        if (!confirm('متأكد إنك عايز تمسح المفتاح ده؟')) return;
        try {
            await apiCall({ method: 'DELETE', body: JSON.stringify({ env, id }) });
            await loadKeys();
        } catch (e) {
            alert(e.message);
        }
    }

    async function revealKey(env, id) {
        try {
            const data = await apiCall({ method: 'POST', body: JSON.stringify({ action: 'reveal', env, id }) });
            alert(data.value);
        } catch (e) {
            alert(e.message);
        }
    }

    if (secret) {
        apiCall().then(() => enterMain()).catch(() => doLogout());
    }
</script>
</body>
</html>
